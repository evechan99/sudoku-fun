<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日數獨 - 媽媽的健腦小天地</title>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFDF9;
            --primary: #D4A373;
            --primary-hover: #CCD5AE;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #E6DFD5;
            --highlight: #FAEDCD;
            --same-num: #E9EDC9;
            --error-color: #E07A5F;
            --success-color: #81B29A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }

        h1 {
            font-size: 1.6rem;
            color: #582F0E;
            margin: 0 0 4px 0;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin: 0 0 10px 0;
        }

        .daily-banner {
            background-color: #FAEDCD;
            color: #6B4F1D;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: #F4F1DE;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #3D405B;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(212, 163, 115, 0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        button.secondary {
            background-color: #E9EDC9;
            color: #386641;
            box-shadow: none;
        }

        .sudoku-board {
            display: grid;
            gap: 2px;
            background-color: #B08968;
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .sudoku-board.size-6 { grid-template-columns: repeat(6, 1fr); }
        .sudoku-board.size-9 { grid-template-columns: repeat(9, 1fr); }

        .cell {
            background-color: #FFFFFF;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1D3557;
            cursor: pointer;
            user-select: none;
        }

        .size-6 .cell { font-size: 1.8rem; }
        
        .cell.initial {
            background-color: #F8F9FA;
            color: #2B2D42;
        }

        .cell.user-input { color: #1D3557; }
        .cell.selected { background-color: var(--highlight) !important; }
        .cell.error { color: var(--error-color); background-color: #FDE2E4; }

        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 14px;
        }

        .num-btn {
            background-color: #FFFFFF;
            border: 2px solid var(--border-color);
            color: #333;
            font-size: 1.4rem;
            padding: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .num-btn:active { background-color: #EFEFEF; }

        .action-pad {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .action-pad button {
            flex: 1;
            padding: 10px;
            font-size: 0.95rem;
        }

        .message-box {
            margin-top: 6px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            display: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* 恭喜過關成績單卡片樣式 */
        .certificate-card {
            display: none;
            background: #FFFBE9;
            border: 3px dashed #D4A373;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            animation: popIn 0.3s ease-out;
        }

        .certificate-card h2 {
            color: #BC6C25;
            margin: 0 0 10px 0;
            font-size: 1.4rem;
        }

        .certificate-info {
            font-size: 1.05rem;
            color: #333;
            margin: 6px 0;
            line-height: 1.5;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧩 每日數獨</h1>
        <p class="subtitle">專為長者設計的健腦小天地</p>
    </header>

    <div class="daily-banner" id="dailyBanner">
        <span id="dateDisplay">載入日期中...</span>
        <span id="nextUpdateInfo" style="font-size: 0.8rem; opacity: 0.8;">每日09:00更新</span>
    </div>

    <div class="stats-bar">
        <span>模式: <span id="modeName">輕鬆 6x6</span></span>
        <span>⏱️ 用時: <span id="timerDisplay">00:00</span></span>
        <span>已完成: <span id="solvedCount">0</span> 題</span>
    </div>

    <div class="controls">
        <button onclick="switchMode('easy6')">輕鬆 (6x6)</button>
        <button class="secondary" onclick="switchMode('std9')">標準 (9x9)</button>
        <button class="secondary" onclick="newPractice()">練習新題</button>
    </div>

    <div id="boardContainer" class="sudoku-board size-6"></div>

    <div class="numpad" id="numpad"></div>

    <div class="action-pad">
        <button class="secondary" onclick="clearCell()">清除格子</button>
        <button class="secondary" onclick="checkAnswers()">檢查對錯</button>
    </div>

    <div id="messageBox" class="message-box"></div>

    <!-- 完成過關成績單（含截圖摘要與時間） -->
    <div id="certificateCard" class="certificate-card">
        <h2>🎉 媽媽好棒！今日挑戰成功</h2>
        <div class="certificate-info" id="certDateText"></div>
        <div class="certificate-info" id="certModeText"></div>
        <div class="certificate-info" id="certTimeText" style="font-size: 1.2rem; font-weight: bold; color: #2D6A4F;"></div>
        <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">媽媽今天腦筋轉得真快，記得明天再來挑戰新題目喔！❤️</p>
        <button onclick="newPractice()" style="margin-top: 8px; width: 100%;">再玩一局新題目</button>
    </div>
</div>

<script>
    let currentMode = 'easy6';
    let boardSize = 6;
    let gridData = [];
    let initialMask = [];
    let solutionData = [];
    let selectedCell = null;
    let solvedTotal = 0;
    
    // 計時器變數
    let secondsElapsed = 0;
    let timerInterval = null;
    let isGameCompleted = false;

    function getTodaySeedString() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const hkTime = new Date(utc + (3600000 * 8));
        
        let hours = hkTime.getHours();
        if (hours < 9) {
            hkTime.setDate(hkTime.getDate() - 1);
        }
        
        const y = hkTime.getFullYear();
        const m = String(hkTime.getMonth() + 1).padStart(2, '0');
        const d = String(hkTime.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function initGame() {
        const todayStr = getTodaySeedString();
        document.getElementById('dateDisplay').innerText = `📅 ${todayStr}`;
        
        if (currentMode === 'easy6') {
            boardSize = 6;
            generateEasy6x6(todayStr);
        } else {
            boardSize = 9;
            generateStd9x9(todayStr);
        }

        selectedCell = null;
        isGameCompleted = false;
        document.getElementById('certificateCard').style.display = 'none';
        document.getElementById('messageBox').style.display = 'none';

        renderBoard();
        renderNumpad();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsElapsed = 0;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!isGameCompleted) {
                secondsElapsed++;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
    }

    function seededRandom(seedStr) {
        let hash = 0;
        for (let i = 0; i < seedStr.length; i++) {
            hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
        }
        let x = Math.sin(hash++) * 10000;
        return x - Math.floor(x);
    }

    function generateEasy6x6(seedStr) {
        solutionData = [
            1,2,3, 4,5,6,
            4,5,6, 1,2,3,
            2,3,1, 5,6,4,
            5,6,4, 2,3,1,
            3,1,2, 6,4,5,
            6,4,5, 3,1,2
        ];
        initialMask = [...solutionData];
        let removeCount = 14;
        for (let i = 0; i < removeCount; i++) {
            let idx = Math.floor(seededRandom(seedStr + i) * 36);
            initialMask[idx] = 0;
        }
        gridData = [...initialMask];
    }

    function generateStd9x9(seedStr) {
        solutionData = [
            5,3,4, 6,7,8, 9,1,2,
            6,7,2, 1,9,5, 3,4,8,
            1,9,8, 3,4,2, 5,6,7,
            8,5,9, 7,6,1, 4,2,3,
            4,2,6, 8,5,3, 7,9,1,
            7,1,3, 9,2,4, 8,5,6,
            9,6,1, 5,3,7, 2,8,4,
            2,8,7, 4,1,9, 6,3,5,
            3,4,5, 2,8,6, 1,7,9
        ];
        initialMask = [...solutionData];
        let removeCount = 30;
        for (let i = 0; i < removeCount; i++) {
            let idx = Math.floor(seededRandom(seedStr + "9x9" + i) * 81);
            initialMask[idx] = 0;
        }
        gridData = [...initialMask];
    }

    function renderBoard() {
        const container = document.getElementById('boardContainer');
        container.innerHTML = '';
        container.className = `sudoku-board size-${boardSize}`;

        gridData.forEach((val, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (initialMask[index] !== 0) {
                cell.classList.add('initial');
                cell.innerText = val;
            } else {
                cell.classList.add('user-input');
                cell.innerText = val !== 0 ? val : '';
            }

            if (selectedCell === index) {
                cell.classList.add('selected');
            }

            cell.onclick = () => {
                if (!isGameCompleted && initialMask[index] === 0) {
                    selectedCell = index;
                    renderBoard();
                }
            };

            container.appendChild(cell);
        });
    }

    function renderNumpad() {
        const numpad = document.getElementById('numpad');
        numpad.innerHTML = '';
        for (let i = 1; i <= boardSize; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => inputNumber(i);
            numpad.appendChild(btn);
        }
    }

    function inputNumber(num) {
        if (isGameCompleted || selectedCell === null) return;
        if (initialMask[selectedCell] !== 0) return;

        gridData[selectedCell] = num;
        renderBoard();
        checkWinCondition();
    }

    function clearCell() {
        if (isGameCompleted || selectedCell === null) return;
        if (initialMask[selectedCell] !== 0) return;

        gridData[selectedCell] = 0;
        renderBoard();
    }

    function checkAnswers() {
        if (isGameCompleted) return;
        let hasError = false;
        const cells = document.querySelectorAll('.cell');
        
        gridData.forEach((val, i) => {
            if (val !== 0 && val !== solutionData[i]) {
                cells[i].classList.add('error');
                hasError = true;
            } else {
                cells[i].classList.remove('error');
            }
        });

        const msgBox = document.getElementById('messageBox');
        msgBox.style.display = 'block';
        if (hasError) {
            msgBox.style.backgroundColor = '#FDE2E4';
            msgBox.style.color = '#C9184A';
            msgBox.innerText = '發現有填錯的數字喔！紅色的格子需要檢查一下。';
        } else {
            msgBox.style.backgroundColor = '#E9EDC9';
            msgBox.style.color = '#386641';
            msgBox.innerText = '目前的數字全部正確，繼續加油！';
        }
    }

    function checkWinCondition() {
        let isComplete = gridData.every((val, i) => val === solutionData[i]);
        if (isComplete) {
            isGameCompleted = true;
            clearInterval(timerInterval);
            solvedTotal++;
            document.getElementById('solvedCount').innerText = solvedTotal;

            // 隱藏一般訊息與鍵盤，顯示精美成績單截圖卡片
            document.getElementById('messageBox').style.display = 'none';
            
            const mins = Math.floor(secondsElapsed / 60);
            const secs = secondsElapsed % 60;
            const timeStr = mins > 0 ? `${mins} 分 ${secs} 秒` : `${secs} 秒`;

            document.getElementById('certDateText').innerText = `📅 日期：${getTodaySeedString()}`;
            document.getElementById('certModeText').innerText = `🧩 模式：${boardSize === 6 ? '輕鬆 (6x6)' : '標準 (9x9)'}`;
            document.getElementById('certTimeText').innerText = `⏱️ 完成用時：${timeStr}`;
            
            document.getElementById('certificateCard').style.display = 'block';
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('modeName').innerText = (mode === 'easy6') ? '輕鬆 6x6' : '標準 9x9';
        initGame();
    }

    function newPractice() {
        const randomSeed = Math.random().toString();
        if (boardSize === 6) generateEasy6x6(randomSeed);
        else generateStd9x9(randomSeed);
        initGame();
    }

    setInterval(() => {
        const currentSeed = getTodaySeedString();
        if (window.lastSeed && window.lastSeed !== currentSeed) {
            initGame();
        }
        window.lastSeed = currentSeed;
    }, 60000);

    window.lastSeed = getTodaySeedString();
    initGame();
</script>

</body>
</html>
